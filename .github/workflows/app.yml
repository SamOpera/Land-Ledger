name: App tests

on:
  push:
    paths-ignore: ["contracts/**", "legacy-v1/**"]
  pull_request:
    paths-ignore: ["contracts/**", "legacy-v1/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
